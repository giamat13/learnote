name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in index.html app.js style.css sw.js manifest.webmanifest glyphs.js config.js; do
            test -f "app/$f" || { echo "missing app/$f"; exit 1; }
          done
          node --check app/app.js
          node --check app/sw.js

      - name: Set Google Analytics ID (optional)
        env:
          GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          if [ -n "$GA_ID" ]; then
            if ! echo "$GA_ID" | grep -Eq '^G-[A-Z0-9]{6,}$'; then echo "Invalid GA_MEASUREMENT_ID"; exit 1; fi
            sed -i "s/G-XXXXXXXXXX/$GA_ID/" app/config.js
            echo "GA ID injected"
          else
            echo "GA_MEASUREMENT_ID not set, analytics stays off"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
